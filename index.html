<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pengalaman VR - Rekonstruksi Empati</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .vr-page {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .label {
      display: inline-block;
      background: #eef0ff;
      color: #5548c8;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    h1 {
      margin: 5px 0;
      font-size: 34px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 25px;
    }

    .vr-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .video-box {
      position: relative;
      width: 100%;
      background: #111827;
      border-radius: 18px;
      overflow: hidden;
    }

    video {
      width: 100%;
      display: block;
      max-height: 600px;
      background: #111;
    }

    .info {
      margin-top: 18px;
      padding: 15px;
      background: #f4f5ff;
      border-radius: 14px;
      color: #4b5563;
      line-height: 1.6;
    }

    .next-button {
      display: block;
      margin: 25px auto 5px;
      padding: 13px 24px;
      border: none;
      border-radius: 25px;
      background: #6658d3;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .next-button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <main class="vr-page">

    <div class="label">🥽 SIMULASI 360°</div>

    <h1>RUANG KELAS</h1>

    <p class="subtitle">
      Pengalaman VR Rekonstruksi Empati
    </p>

    <div class="vr-card">

      <div class="video-box">

        <video
          id="vrVideo"
          controls
          playsinline
          preload="metadata">

          <source
            src="video-relasional-cyber[1].mp4"
            type="video/mp4">

          Browser kamu tidak mendukung pemutaran video.
        </video>

      </div>

      <div class="info">
        🎧 <b>Petunjuk pengalaman:</b><br>
        Tonton video sampai selesai. Perhatikan situasi yang dialami
        dalam skenario bullying dan coba pahami perasaan dari sudut
        pandang korban.
      </div>

      <button
        class="next-button"
        onclick="window.location.href='refleksi.html'">

        Lanjut ke Refleksi →
      </button>

    </div>

  </main>

</body>
</html>
